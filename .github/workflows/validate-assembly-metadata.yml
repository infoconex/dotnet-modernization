name: Validate .NET assembly metadata extractor

on:
  pull_request:
    paths:
      - "tooling/assembly-metadata/**"
      - "tooling/validators/compatibility.py"
      - ".github/workflows/validate-assembly-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-fixtures:
    name: Metadata extractor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install exact .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.403"
      - name: Record SDK information
        run: dotnet --info
      - name: Build, inspect and compare independent fixture
        run: python -m unittest discover -s tooling/assembly-metadata/tests -v
