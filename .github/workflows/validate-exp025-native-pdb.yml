name: EXP-025 native Windows PDB Source Link structural proof

on:
  pull_request:
    paths:
      - '.github/workflows/validate-exp025-native-pdb.yml'
      - 'tooling/validators/native_windows_pdb_sourcelink.py'
      - 'tooling/validators/tests/test_native_windows_pdb_sourcelink.py'
      - 'projects/recordsift/evaluations/2026-11-pre-sdk/experiments/EXP-025-windows-pdb-identity.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate structural reader synthetic negative controls
        shell: pwsh
        run: |
          python -m unittest discover -s tooling/validators/tests -p test_native_windows_pdb_sourcelink.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native PDB parser regression tests failed.' }

  real-windows-symbol:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: infoconex/RecordSift
          ref: 8358780829458854a4b0356df5ac5e685f0a34c8
          path: recordsift
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Build frozen metadata inspector
        shell: pwsh
        run: |
          dotnet build tooling/assembly-metadata/src/AssemblyMetadata.csproj -c Release -nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Metadata inspection dependency failed.' }
      - name: Build disposable integrated CSV and run unchanged candidate gates
        shell: pwsh
        run: |
          & ./tooling/pilots/recordsift/EXP-024/run.ps1 -ApplicationRoot (Join-Path $env:GITHUB_WORKSPACE 'recordsift') -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'RecordSift-EXP-024-for-025')
          if ($LASTEXITCODE -ne 0) { throw 'EXP-024 compilation and compatibility prerequisite failed.' }
      - name: Read real Windows PDB named Source Link streams and CodeView identity
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'recordsift/src/RecordSift.Infrastructure.Csv/bin/Release'
          $out=Join-Path $env:RUNNER_TEMP 'exp025-native-windows-pdb.json'
          python tooling/validators/native_windows_pdb_sourcelink.py --pdb (Join-Path $root 'RecordSift.Infrastructure.Csv.pdb') --dll (Join-Path $root 'RecordSift.Infrastructure.Csv.dll') --output $out
          if ($LASTEXITCODE -ne 0) { throw 'Actual compiled Windows PDB Source Link structural validation failed.' }
          $report=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($report.source_commit -cne '8358780829458854a4b0356df5ac5e685f0a34c8' -or
              $report.pe_codeview_pdb_identity -cne 'matched' -or $report.document_mapping_count -lt 1) {
            throw 'Actual PDB native symbol identity or source mapping unproven.'
          }
      - name: Retain metadata-only positive or failure evidence, no binaries/PDB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exp025-native-pdb-report-only
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/exp025-native-windows-pdb.json
            ${{ runner.temp }}/RecordSift-EXP-024-for-025/experiment-report.json
            ${{ runner.temp }}/RecordSift-EXP-024-for-025/candidate-versus-original-compatibility.json
            ${{ runner.temp }}/RecordSift-EXP-024-for-025/candidate-acceptance/pilot-report.json
