name: EXP-027 real NuGet acquisition graph and application-pin conflict

# Historical experiment: manual execution only; no automatic PR builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-nuget-resolver:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: infoconex/RecordSift
          ref: 8358780829458854a4b0356df5ac5e685f0a34c8
          path: recordsift
          persist-credentials: false
      - name: Resolve official Source Link NuGet dependency closure in ephemeral directory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'exp027-packages'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $source='https://api.nuget.org/v3/index.json'
          & nuget install Microsoft.SourceLink.GitHub -Version 10.0.403 -OutputDirectory $root -DependencyVersion Lowest -Framework net48 -Source $source -NonInteractive -Verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'NuGet dependency acquisition resolution failed.' }
          $folders=@(Get-ChildItem -LiteralPath $root -Directory)
          $packages=@()
          foreach($d in $folders){
            $archive=@(Get-ChildItem -LiteralPath $d.FullName -Filter '*.nupkg' -File)
            if($archive.Count -ne 1){throw "NuGet archive bytes unavailable: $($d.Name)"}
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip=[IO.Compression.ZipFile]::OpenRead($archive[0].FullName)
            try {
              $man=@($zip.Entries | Where-Object { $_.FullName -like '*.nuspec' })
              if($man.Count -ne 1){throw "Expected one *embedded* NuGet manifest: $($d.Name)"}
              $reader=[IO.StreamReader]::new($man[0].Open())
              try { [xml]$nuspec=$reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $zip.Dispose() }
            $id=[string]$nuspec.package.metadata.id
            $version=[string]$nuspec.package.metadata.version
            if(-not $id -or -not $version -or $d.Name -cne "$id.$version"){throw "Invalid acquisition package identity: $($d.Name)"}
            $packages+=@([ordered]@{
              id=$id;version=$version;
              archive_sha256=(Get-FileHash -LiteralPath $archive[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            })
          }
          $baselinePath=Join-Path $env:GITHUB_WORKSPACE 'recordsift/src/RecordSift.Infrastructure.Csv/packages.config'
          [xml]$base=Get-Content -LiteralPath $baselinePath -Raw
          $original=@{}
          foreach($p in $base.packages.package){
             if($original.ContainsKey([string]$p.id)){throw 'Duplicate frozen baseline package'}
             $original[[string]$p.id]=[string]$p.version
          }
          if($original.Count -ne 9){throw 'Wrong frozen package list'}
          $overlaps=@()
          foreach($p in $packages){
            if($original.ContainsKey($p.id)){
              $overlaps+=@([ordered]@{id=$p.id;baseline=$original[$p.id];resolved=$p.version;different=($original[$p.id] -cne $p.version)})
            }
          }
          $expectedUpgrades=@{
            'System.Buffers'='4.6.1';
            'System.Memory'='4.6.3';
            'System.Numerics.Vectors'='4.6.1';
            'System.Runtime.CompilerServices.Unsafe'='6.1.2'
          }
          if($packages.Count -ne 8 -or $overlaps.Count -ne 4) {
            throw "Unexpected net48 NuGet closure count: packages=$($packages.Count) overlaps=$($overlaps.Count)"
          }
          foreach($pair in $expectedUpgrades.GetEnumerator()){
            $matches=@($overlaps | Where-Object { $_.id -ceq $pair.Key })
            if($matches.Count -ne 1 -or $matches[0].resolved -cne $pair.Value -or
                -not $matches[0].different -or
                [version]$matches[0].resolved -le [version]$matches[0].baseline) {
              throw "Unexpected resolved version or baseline overlap for $($pair.Key)"
            }
          }
          $sourceStatus=@(& git -C (Join-Path $env:GITHUB_WORKSPACE 'recordsift') diff --name-only HEAD --)
          if($LASTEXITCODE -ne 0 -or $sourceStatus.Count -gt 0){throw 'Unexpected tracked application modifications'}
          $report=[ordered]@{
             experiment='EXP-027';frozen_commit='8358780829458854a4b0356df5ac5e685f0a34c8';
             action='nuget_install_to_ephemeral_directory_NOT_VS_project_install';
             selection='NuGet.DependencyVersion.Lowest';package_count=$packages.Count;
             archive_packages=@($packages|Sort-Object id);
             baseline_version_overlaps=$overlaps;
             existing_packages_config_unchanged=$true;
             verdict='CONVENTIONAL_NUGET_CLOSURE_CONFLICTS_WITH_APPLICATION_PINS';
             not_proven='MSBuild runtime dependency isolation, NuGet Package Manager .csproj changes, actual compiler/runtime behavior'
          }
          $report|ConvertTo-Json -Depth 12 |Set-Content (Join-Path $env:RUNNER_TEMP 'exp027-nuget-acquisition.json') -Encoding utf8
          Write-Host "PASS: NuGet resolved $($packages.Count) actual package identities, four pinned application version overlaps; project untouched."
      - name: Retain metadata only (no package archives)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exp027-nuget-closure-metadata
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/exp027-nuget-acquisition.json
