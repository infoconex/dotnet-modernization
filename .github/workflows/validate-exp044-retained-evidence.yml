name: EXP-044 immutable sanitized live evidence replay (research only)

on:
  pull_request:
    paths:
      - '.github/workflows/validate-exp044-retained-evidence.yml'
      - 'tooling/validators/gate_cn_live_evidence_consistency.py'
      - 'tooling/validators/tests/test_gate_cn_live_evidence_consistency.py'
      - 'methodology/acceptance-gates/gate-cn-exp044-evidence-scope.json'
      - 'methodology/acceptance-gates/evidence/exp044-non-recordsift-sanitized.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  immutable-historical-sanitized-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Exercise synthetic secondary consistency and negative controls
        run: python3 -m unittest discover -s tooling/validators/tests -p 'test_gate_cn_live_evidence_consistency.py' -v

      - name: Authenticate actual historical EXP-044 run and zip before sanitized replay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          root="$RUNNER_TEMP/exp044-archive-replay"
          mkdir -p "$root"
          scope="methodology/acceptance-gates/gate-cn-exp044-evidence-scope.json"
          run_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["source_evidence"]["run_id"])' "$scope")"
          artifact_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["source_evidence"]["artifact_id"])' "$scope")"
          api="https://api.github.com/repos/infoconex/dotnet-modernization/actions/artifacts/$artifact_id"
          curl --fail --silent --show-error --proto '=https' --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$api" -o "$root/artifact-metadata.json"
          curl --fail --silent --show-error --proto '=https' --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/infoconex/dotnet-modernization/actions/runs/$run_id" \
            -o "$root/run-metadata.json"
          python3 - "$scope" "$root/artifact-metadata.json" "$root/run-metadata.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding="utf-8"))["source_evidence"]
          a=json.load(open(sys.argv[2],encoding="utf-8"))
          r=json.load(open(sys.argv[3],encoding="utf-8"))
          assert r["id"] == s["run_id"]
          assert r["head_sha"] == s["executing_research_sha"]
          assert r["workflow_id"] == s["workflow_id"]
          assert r["status"] == "completed" and r["conclusion"] == "success"
          assert r["event"] == "pull_request"
          assert r["repository"]["full_name"] == "infoconex/dotnet-modernization"
          assert a["id"] == s["artifact_id"]
          assert a["workflow_run"]["id"] == s["run_id"]
          assert a["workflow_run"]["head_sha"] == s["executing_research_sha"]
          assert a["digest"] == "sha256:" + s["artifact_zip_sha256"]
          assert a["name"] == "exp044-non-recordsift-trusted-live-sanitized"
          assert a["expired"] is False
          assert 0 < a["size_in_bytes"] <= 65536
          PY
          curl --silent --show-error --proto '=https' --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -D "$root/headers.private" -o /dev/null "$api/zip"
          python3 - "$root/headers.private" "$root/bloburl.private" <<'PY'
          import sys,urllib.parse
          headers=open(sys.argv[1],encoding="iso-8859-1").read().splitlines()
          urls=[line.split(":",1)[1].strip() for line in headers
                if line.lower().startswith("location:")]
          assert len(urls)==1
          u=urllib.parse.urlparse(urls[0])
          host=(u.hostname or "").lower()
          assert u.scheme=="https" and u.port in (None,443)
          assert host.endswith(".blob.core.windows.net") or host.endswith(".githubusercontent.com")
          open(sys.argv[2],"w",encoding="utf-8").write(urls[0])
          PY
          bloburl="$(cat "$root/bloburl.private")"
          curl --fail --location --silent --show-error --proto '=https' \
            --proto-redir '=https' --max-time 60 --max-filesize 65536 \
            "$bloburl" --output "$root/sanitized.zip"
          python3 - "$root/sanitized.zip" "$scope" "$root" <<'PY'
          import hashlib,json,sys,zipfile
          p,scope_path,root=sys.argv[1:]
          expected=json.load(open(scope_path,encoding="utf-8"))["source_evidence"]
          data=open(p,"rb").read()
          assert hashlib.sha256(data).hexdigest()==expected["artifact_zip_sha256"]
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert names==["exp044-sanitized.json"]
              info=z.getinfo(names[0])
              assert 0 < info.file_size <= 128*1024
              raw=z.read(names[0])
              assert isinstance(json.loads(raw),dict)
              with open(root+"/exp044-sanitized.json","wb") as f: f.write(raw)
          PY
          python3 tooling/validators/gate_cn_live_evidence_consistency.py \
            --scope "$scope" --report "$root/exp044-sanitized.json"
          # Separately retain ONLY exact sanitized public report bytes in Git.
          # The archived text and the original expiring artifact must match
          # the external pinned report SHA256 exactly, byte-for-byte.
          python3 - "$root/exp044-sanitized.json" "$scope" \
            "methodology/acceptance-gates/evidence/exp044-non-recordsift-sanitized.json" <<'PY'
          import hashlib,json,sys
          actual=open(sys.argv[1],"rb").read()
          archived=open(sys.argv[3],"rb").read()
          expected=json.load(open(sys.argv[2],encoding="utf-8"))["source_evidence"]["sanitized_json_sha256"]
          assert actual == archived, "Durable sanitized report differs from original artifact"
          assert hashlib.sha256(actual).hexdigest() == expected
          assert hashlib.sha256(archived).hexdigest() == expected
          print("EXP044 immutable public report bytes and retained Git copy agree")
          PY
          # Only after allowlisted content, source-run identity, and ZIP
          # authentication pass, print public JSON bytes for durable archiving.
          python3 - "$root/exp044-sanitized.json" <<'PY'
          import base64,hashlib,sys
          raw=open(sys.argv[1],"rb").read()
          print("EXP044_VERIFIED_SANITIZED_JSON_SHA256="+hashlib.sha256(raw).hexdigest())
          print("EXP044_VERIFIED_SANITIZED_JSON_BASE64="+base64.b64encode(raw).decode("ascii"))
          PY

      - name: Erase temporary zip, public report and PRIVATE signed redirect
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/exp044-archive-replay"

      - name: Preserve authorization limits
        run: echo 'Research aggregate replay only; actual PDB and compiler bytes NOT rerun. Gate C UNSATISFIED; C-N release NOT AUTHORIZED; Source Link HOLD'
