name: Gate C-N D2a real Windows negative controls (RESEARCH ONLY)

on:
  pull_request:
    paths:
      - '.github/workflows/validate-gate-cn-d2a-real-negatives.yml'
      - 'tooling/fixtures/gate-cn/D2a/**'
      - 'tooling/pilots/gate-cn/D2a/**'
      - 'methodology/acceptance-gates/reviews/2026-11-06/gate-cn-d2a-**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-net48-real-pdb-negatives:
    name: Single traditional net48 / native PDB / 5 real D2a controls
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out exact immutable research experiment source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate exact runner source revision
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) {
            throw 'D2A_EXECUTING_SHA_INVALID'
          }

      - name: Two actual traditional net48 compilers, five preregistered negative controls
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & ./tooling/pilots/gate-cn/D2a/run.ps1 -ExpectedCommit $env:EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'D2A_REAL_RESEARCH_TEST_FAILED' }

      - name: Unconditionally remove private witnesses and disposable output
        if: always()
        shell: pwsh
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'gate-cn-d2a-private'
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'tooling/fixtures/gate-cn/D2a'
          foreach ($path in @($private, (Join-Path $fixture 'bin'), (Join-Path $fixture 'obj'))) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
            }
          }

      - name: Retain only fixed-category sanitized research verdict
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-cn-d2a-real-negatives-sanitized
          path: ${{ runner.temp }}/gate-cn-d2a-sanitized.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve release HOLD and no-merge disposition
        if: always()
        shell: pwsh
        run: |
          Write-Host 'D2a ONLY real dummy compiler research; no RecordSift, NuGet or production gate.'
          Write-Host 'Managed Gate C UNSATISFIED; native Gate C-N release NOT_AUTHORIZED; Source Link production HOLD'
