name: Validate reusable modernization tooling

on:
  pull_request:
    paths:
      - ".github/workflows/validate-modernization-tooling.yml"
      - "tooling/validators/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python stdlib validators (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout PR
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Inventory runtime
        run: python --version
      - name: Run isolated fixture tests
        run: python -m unittest discover -s tooling/validators/tests -v
