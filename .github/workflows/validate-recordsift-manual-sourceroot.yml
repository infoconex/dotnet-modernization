name: EXP-022 legacy C# manual SourceRoot root-only provider

on:
  pull_request:
    paths:
      - ".github/workflows/validate-recordsift-manual-sourceroot.yml"
      - "tooling/pilots/recordsift/EXP-022/**"
      - "projects/recordsift/evaluations/2026-11-pre-sdk/experiments/EXP-022-manual-sourceroot.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  missing-sourceroot-control:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout research without push credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Checkout exact frozen RecordSift Git source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: infoconex/RecordSift
          ref: 8358780829458854a4b0356df5ac5e685f0a34c8
          path: recordsift
          fetch-depth: 0
          persist-credentials: false
      - name: Pin existing metadata reader toolchain
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.403"
      - name: Portable PE metadata comparator controls
        shell: pwsh
        run: |
          python -m unittest discover -s tooling/validators/tests -p test_pe_variation.py -v
          if ($LASTEXITCODE -ne 0) { throw 'PE fixtures failed.' }
      - name: Compile no-load read-only PE and assembly inspectors
        shell: pwsh
        run: |
          $sdk = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sdk -cne '10.0.403') { throw "Wrong SDK $sdk" }
          dotnet build tooling/assembly-metadata/src/AssemblyMetadata.csproj -c Release -nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Assembly metadata reader failed.' }
          dotnet build tooling/pe-provenance/src/PeProvenance.csproj -c Release -nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Managed PE reader failed.' }
      - name: Full negative controls and manual SourceRoot positive experiment
        shell: pwsh
        run: |
          & ./tooling/pilots/recordsift/EXP-022/run.ps1 -ApplicationRoot (Join-Path $env:GITHUB_WORKSPACE 'recordsift') -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'RecordSift-EXP-022')
          if ($LASTEXITCODE -ne 0) { throw 'EXP-022 did not prove positive root-gated compatibility.' }
      - name: Keep JSON and original NUnit evidence, not DLL/PDB/nupkg
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recordsift-exp022-source-root-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/RecordSift-EXP-022/experiment-report.json
            ${{ runner.temp }}/RecordSift-EXP-022/computed-pathmaps.json
            ${{ runner.temp }}/RecordSift-EXP-022/pe-comparison.json
            ${{ runner.temp }}/RecordSift-EXP-022/provided-root-*-pe.json
            ${{ runner.temp }}/RecordSift-EXP-022/provided-root-*-logical.json
            ${{ runner.temp }}/RecordSift-EXP-022/provided-root-*-release-evidence/pilot-report.json
            ${{ runner.temp }}/RecordSift-EXP-022/provided-root-*-release-evidence/nunit-*.xml
            ${{ runner.temp }}/RecordSift-EXP-022/negative-controls/experiment-report.json
            ${{ runner.temp }}/RecordSift-EXP-022/negative-controls/effective-properties.json
            ${{ runner.temp }}/RecordSift-EXP-022/negative-controls/deterministic-only-controls/experiment-report.json
