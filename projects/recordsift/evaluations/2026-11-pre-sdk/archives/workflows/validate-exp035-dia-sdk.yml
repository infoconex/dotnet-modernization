name: EXP-035 signed Visual Studio DIA checksum feasibility (research only)

# Historical experiment: manual execution only; no automatic PR builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Independent positive and corrupted negative checksum controls
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'tooling/validators'
          python -m unittest discover -s tooling/validators/tests -p test_dia_source_checksum_assessment.py -v
          if($LASTEXITCODE -ne 0){throw 'DIA comparator controls failed'}
  actual-managed-pdb-dia-feasibility:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: infoconex/RecordSift
          ref: 8358780829458854a4b0356df5ac5e685f0a34c8
          fetch-depth: 0
          path: recordsift
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Compile existing independent metadata inspection tool
        shell: pwsh
        run: |
          dotnet build tooling/assembly-metadata/src/AssemblyMetadata.csproj -c Release -nologo -v minimal
          if($LASTEXITCODE -ne 0){throw 'Original metadata validator unavailable'}
      - name: Unchanged original release acceptance and disposable CSV native PDB
        shell: pwsh
        run: |
          & ./tooling/pilots/recordsift/EXP-024/run.ps1 -ApplicationRoot (Join-Path $env:GITHUB_WORKSPACE 'recordsift') -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'RecordSift-EXP-024-for-035')
          if($LASTEXITCODE -ne 0){throw 'Release, package or consumer baseline failed'}
      - name: Native CodeView identity already verified; inspect signed DIA SDK source-file table
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'recordsift'
          $out=Join-Path $root 'src/RecordSift.Infrastructure.Csv/bin/Release'
          python tooling/validators/native_windows_pdb_sourcelink.py --pdb (Join-Path $out 'RecordSift.Infrastructure.Csv.pdb') --dll (Join-Path $out 'RecordSift.Infrastructure.Csv.dll') --output (Join-Path $env:RUNNER_TEMP 'exp035-native-identity.json')
          if($LASTEXITCODE -ne 0){throw 'PDB identity/source mapping validation failed'}
          & ./tooling/pilots/recordsift/EXP-035/probe.ps1 -ApplicationRoot $root -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'exp035-dia')
          if($LASTEXITCODE -ne 0){throw 'DIA SDK feasibility not established'}
      - name: Retain limited redacted metadata only (no binaries/PDB/source)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exp035-signed-dia-sdk-research
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/exp035-native-identity.json
            ${{ runner.temp }}/exp035-dia/dia-checksum-assessment.json
            ${{ runner.temp }}/exp035-dia/dia-tool-provenance.json
            ${{ runner.temp }}/RecordSift-EXP-024-for-035/experiment-report.json
            ${{ runner.temp }}/RecordSift-EXP-024-for-035/candidate-versus-original-compatibility.json
